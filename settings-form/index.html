<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<style>
  :root { --bg: #f6f7f9; --fg: #1b1f24; --card: #ffffff; --err: #b3261e; --acc: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12141a; --fg: #e6e8ee; --card: #1d212b; --err: #ff9d94; --acc: #60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 480px; margin: 40px auto; padding: 24px; background: var(--card); border-radius: 10px; }
  h1 { margin-top: 0; font-size: 1.4rem; }
  .field { margin-bottom: 16px; }
  label { display: block; margin-bottom: 4px; font-weight: 600; }
  input, select { width: 100%; padding: 8px; border: 1px solid #888; border-radius: 6px; background: var(--bg); color: var(--fg); }
  [aria-invalid="true"] { border-color: var(--err); }
  .error { color: var(--err); font-size: 0.85rem; min-height: 1.1em; margin: 4px 0 0; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 6px; background: var(--acc); color: #fff; font-weight: 600; }
  .ok { color: #15803d; font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Settings</h1>
  <form id="settings" novalidate>
    <div class="field">
      <label for="displayName">Display name</label>
      <input id="displayName" name="displayName" autocomplete="name">
      <p class="error" data-error-for="displayName" role="alert"></p>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email">
      <p class="error" data-error-for="email" role="alert"></p>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password">
      <p class="error" data-error-for="password" role="alert"></p>
    </div>
    <div class="field">
      <label for="passwordConfirm">Confirm password</label>
      <input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password">
      <p class="error" data-error-for="passwordConfirm" role="alert"></p>
    </div>
    <div class="field">
      <label for="theme">Theme</label>
      <select id="theme" name="theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="system" selected>System</option>
      </select>
      <p class="error" data-error-for="theme" role="alert"></p>
    </div>
    <div class="field">
      <label for="maxResults">Max results</label>
      <input id="maxResults" name="maxResults" type="number" inputmode="numeric" min="1" max="100" value="20">
      <p class="error" data-error-for="maxResults" role="alert"></p>
    </div>
    <button type="submit">Save settings</button>
    <p class="ok" id="saved" hidden>Saved.</p>
  </form>
</main>
<script src="src/validate.js"></script>
<script src="app.js"></script>
</body>
</html>
